# Humon Slack app manifest (Open Question #1: yes, ship one).
#
# Create the app in one click:
#   https://api.slack.com/apps  →  "Create New App"  →  "From an app manifest"
#   paste this file, then:
#     - install to workspace, copy the Bot User OAuth Token (xoxb-…) → SLACK_BOT_TOKEN
#     - Basic Information → App-Level Tokens → generate a token with
#       connections:write scope (xapp-…) → SLACK_APP_TOKEN
#
# Socket Mode means zero inbound ports: Slack pushes events over an outbound
# websocket Humon opens.

display_information:
  name: Humon
  description: Your self-hosted assistant with hands inside the LAN.
  background_color: "#1f2933"

features:
  bot_user:
    display_name: humon
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read      # hear @humon mentions
      - chat:write             # post and edit messages
      - im:history             # read DMs
      - im:read
      - im:write               # open/DM
      - reactions:read         # approval reactions (FR-2.3)
      - channels:history       # read threads it's in
      - groups:history

settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
